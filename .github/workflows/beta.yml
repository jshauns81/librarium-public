name: Publish beta
run-name: ${{ inputs.publish && format('Finalize {0} from {1} rehearsal {2} attempt {3} stack {4}', inputs.version, inputs.source-sha, inputs.rehearsal-run, inputs.rehearsal-attempt, inputs.stack-sha256) || format('Rehearse {0} from {1}', inputs.version, inputs.source-sha) }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Strict unused beta version
        required: true
        type: string
      source-sha:
        description: Full reviewed main commit
        required: true
        type: string
      publish:
        description: Finalize a locally audited and privately staged pair
        type: boolean
        default: false
      rehearsal-run:
        description: Successful rehearsal run ID (required for finalization)
        type: string
      rehearsal-attempt:
        description: Audited rehearsal attempt number (required for finalization)
        type: string
      stack-sha256:
        description: Independently reviewed stack archive SHA-256 (required for finalization)
        type: string
permissions:
  contents: read
concurrency:
  group: librarium-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify main source and unused version
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = jshauns81/librarium-public
          test "$GITHUB_REF" = refs/heads/main
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$(git rev-parse origin/main)"
          python3 scripts/release.py validate --version="$VERSION" --commit="$SOURCE_SHA"
          test -z "$(git tag --list "$VERSION")"
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          import promotion
          if promotion.GitHub(os.environ['GH_TOKEN']).get('/releases/tags/' + os.environ['VERSION'], missing=True) is not None:
              raise SystemExit('release version already exists')
          PY
  quality:
    if: ${{ !inputs.publish }}
    needs: validate
    uses: ./.github/workflows/quality.yml # zizmor: ignore[self-repository] ci_policy.py and actionlint 1.7.12 require ./ relative reusable workflow paths
    with:
      source-sha: ${{ inputs.source-sha }}
  acceptance:
    if: ${{ !inputs.publish }}
    needs: validate
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/container.yml # zizmor: ignore[self-repository] ci_policy.py and actionlint 1.7.12 require ./ relative reusable workflow paths
    with:
      source-sha: ${{ inputs.source-sha }}
      export-image: true
  rehearsal:
    if: ${{ !inputs.publish }}
    needs: [validate, quality, acceptance]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/accepted
      - name: Validate paired image identity and release assets before publication
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          EXPECTED_IMAGE_ID: ${{ needs.acceptance.outputs.image-id }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          BROWSER_IMAGE_ID=$(python3 scripts/release.py verify-images --commit="$SOURCE_SHA" --image-id="$EXPECTED_IMAGE_ID" --receipt="$RUNNER_TEMP/accepted/accepted-images.json")
          python3 scripts/check_public_content.py
          mkdir -p "$RUNNER_TEMP/preflight"
          python3 scripts/release.py stack-assets --output="$RUNNER_TEMP/preflight/stack-assets.zip"
          uv run --no-project --python "$(cat .python-version)" python scripts/release.py manifest --version="$VERSION" --commit="$SOURCE_SHA" --digest="$EXPECTED_IMAGE_ID" --browser-digest="$BROWSER_IMAGE_ID" --image-id="$EXPECTED_IMAGE_ID" --browser-image-id="$BROWSER_IMAGE_ID" --run-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --output="$RUNNER_TEMP/preflight/manifest-preflight.json"
      - name: Retain release preflight assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-preflight-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preflight/
          retention-days: 3
          if-no-files-found: error
  publish:
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Select exact rehearsal attempt
        id: prior
        env:
          RUN_ID: ${{ inputs.rehearsal-run }}
          REQUESTED_ATTEMPT: ${{ inputs.rehearsal-attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REQUESTED_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$RUN_ID" != "$GITHUB_RUN_ID"
          ATTEMPT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.run_attempt')
          [[ "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          test "$ATTEMPT" = "$REQUESTED_ATTEMPT"
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.rehearsal-run }}
          name: tested-image-${{ steps.prior.outputs.attempt }}
          path: ${{ runner.temp }}/accepted
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.rehearsal-run }}
          name: release-preflight-${{ steps.prior.outputs.attempt }}
          path: ${{ runner.temp }}/preflight
      - name: Verify rehearsal provenance and staged private image pair
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          RUN_ID: ${{ inputs.rehearsal-run }}
          REVIEWED_STACK_SHA: ${{ inputs.stack-sha256 }}
          REHEARSAL_ATTEMPT: ${{ steps.prior.outputs.attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          uv run --no-project --python "$(cat .python-version)" python scripts/promotion.py verify-rehearsal --version="$VERSION" --source="$SOURCE_SHA" --run-id="$RUN_ID" --attempt="$REHEARSAL_ATTEMPT" --manifest="$RUNNER_TEMP/preflight/manifest-preflight.json" --receipt="$RUNNER_TEMP/accepted/accepted-images.json" --stack="$RUNNER_TEMP/preflight/stack-assets.zip" --stack-sha256="$REVIEWED_STACK_SHA"
          python3 scripts/registry.py verify-pair "$VERSION" --commit="$SOURCE_SHA" --receipt="$RUNNER_TEMP/accepted/accepted-images.json" > "$RUNNER_TEMP/pair.json"
      - name: Publish the accepted image pair and immutable release record
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source-sha }}
          RUN_ID: ${{ inputs.rehearsal-run }}
          REHEARSAL_ATTEMPT: ${{ inputs.rehearsal-attempt }}
          REVIEWED_STACK_SHA: ${{ inputs.stack-sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --no-project --python "$(cat .python-version)" python scripts/promotion.py verify-rehearsal --version="$VERSION" --source="$SOURCE_SHA" --run-id="$RUN_ID" --attempt="$REHEARSAL_ATTEMPT" --manifest="$RUNNER_TEMP/preflight/manifest-preflight.json" --receipt="$RUNNER_TEMP/accepted/accepted-images.json" --stack="$RUNNER_TEMP/preflight/stack-assets.zip" --stack-sha256="$REVIEWED_STACK_SHA"
          python3 scripts/registry.py verify-pair "$VERSION" --commit="$SOURCE_SHA" --receipt="$RUNNER_TEMP/accepted/accepted-images.json" > "$RUNNER_TEMP/pair-recheck.json"
          cmp "$RUNNER_TEMP/pair.json" "$RUNNER_TEMP/pair-recheck.json"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          pair = json.loads((temp / 'pair.json').read_text())
          receipt = json.loads((temp / 'accepted/accepted-images.json').read_text())
          command = ['uv', 'run', '--no-project', '--python', pathlib.Path('.python-version').read_text().strip(), 'python', 'scripts/release.py', 'manifest', '--version=' + os.environ['VERSION'], '--commit=' + os.environ['SOURCE_SHA'], '--digest=' + pair['application'], '--browser-digest=' + pair['source-browser'], '--image-id=' + receipt['application'], '--browser-image-id=' + receipt['source-browser'], '--run-url=' + os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['RUN_ID'], '--output=release-manifest.json']
          subprocess.run(command, check=True)
          path = pathlib.Path('release-manifest.json')
          manifest = json.loads(path.read_text())
          manifest['acceptance']['rehearsal_attempt'] = int(os.environ['REHEARSAL_ATTEMPT'])
          manifest['acceptance']['finalization_run'] = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          cp "$RUNNER_TEMP/preflight/stack-assets.zip" stack-assets.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" "$SOURCE_SHA" -m "Tested beta $VERSION"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "refs/tags/$VERSION"
          gh release create "$VERSION" release-manifest.json stack-assets.zip --verify-tag --draft --prerelease --latest=false --title "Librarium $VERSION" --notes-file docs/beta-release-notes.md
          RELEASE_ID=$(gh release view "$VERSION" --json databaseId --jq '.databaseId')
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/uploaded-release.json"
          python3 scripts/release.py verify-assets --receipt="$RUNNER_TEMP/uploaded-release.json" --manifest-file=release-manifest.json --stack-file=stack-assets.zip
          python3 scripts/registry.py verify-pair "$VERSION" --commit="$SOURCE_SHA" --receipt="$RUNNER_TEMP/accepted/accepted-images.json" > "$RUNNER_TEMP/pair-final.json"
          cmp "$RUNNER_TEMP/pair.json" "$RUNNER_TEMP/pair-final.json"
          uv run --no-project --python "$(cat .python-version)" python scripts/promotion.py verify-rehearsal --version="$VERSION" --source="$SOURCE_SHA" --run-id="$RUN_ID" --attempt="$REHEARSAL_ATTEMPT" --manifest="$RUNNER_TEMP/preflight/manifest-preflight.json" --receipt="$RUNNER_TEMP/accepted/accepted-images.json" --stack="$RUNNER_TEMP/preflight/stack-assets.zip" --stack-sha256="$REVIEWED_STACK_SHA"
          gh release edit "$VERSION" --draft=false --prerelease --latest=false
