name: Synthetic writer acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/delivery-writer.yml'
      - '.github/scripts/delivery_native_acceptance.sh'
      - '.github/scripts/delivery_*.py'
      - '.github/scripts/synthetic_epub_fixtures.py'
      - 'Dockerfile.writer'
      - '.dockerignore'
      - 'scripts/run_delivery_writer.py'
      - 'scripts/calibre_*'
      - 'scripts/delivery_recovery.py'
      - 'scripts/build_libarchive.py'
      - 'scripts/install_epubcheck.py'
      - 'backend/librarium/delivery_*.py'
      - 'backend/librarium/recovery_evidence.py'
      - 'backend/librarium/direct_library*.py'
      - 'backend/librarium/epubcheck_distribution.json'
      - 'backend/tests/test_delivery_*.py'
      - 'backend/tests/test_deployment.py'
      - 'tests/test_delivery_*.py'
      - 'tests/test_calibre_*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: writer-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  pinned-writer-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the separate pinned writer target
        run: docker build --file Dockerfile.writer --target writer --tag librarium-writer-acceptance .
      - name: Default entrypoint refuses activation
        run: |
          if docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp:rw,nosuid,nodev,size=512m librarium-writer-acceptance > "$RUNNER_TEMP/writer-disabled.log" 2>&1; then
            exit 1
          fi
          python3 - "$RUNNER_TEMP/writer-disabled.log" <<'PY'
          from pathlib import Path
          import sys
          raise SystemExit("writer_disabled" not in Path(sys.argv[1]).read_text())
          PY
      - name: Enabled image launcher reaches synthetic refusal
        run: |
          if docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp:rw,nosuid,nodev,size=512m --tmpfs /state:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 --tmpfs /state/config:rw,nosuid,nodev,size=8m,uid=10001,gid=10001,mode=0700 --env LIBRARIUM_DELIVERY_ENABLED=1 librarium-writer-acceptance > "$RUNNER_TEMP/writer-enabled.log" 2>&1; then
            cat "$RUNNER_TEMP/writer-enabled.log"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/writer-enabled.log" <<'PYCODE'
          from pathlib import Path
          import sys
          log = Path(sys.argv[1]).read_text()
          if "synthetic_only_required" not in log:
              print(log[-4000:])
              raise SystemExit(1)
          PYCODE
      - name: Enabled launcher without a state volume refuses plainly
        run: |
          if docker run --rm --network none --read-only --cap-drop ALL --tmpfs /tmp:rw,nosuid,nodev,size=512m --env LIBRARIUM_DELIVERY_ENABLED=1 librarium-writer-acceptance > "$RUNNER_TEMP/writer-no-state.log" 2>&1; then
            cat "$RUNNER_TEMP/writer-no-state.log"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/writer-no-state.log" <<'PYCODE'
          from pathlib import Path
          import sys
          log = Path(sys.argv[1]).read_text()
          plain = any(
              line.startswith("Writer refused to start: writer_state_unavailable.")
              for line in log.splitlines()
          )
          if not plain or "Traceback" in log:
              print(log[-4000:])
              raise SystemExit(1)
          PYCODE
      - name: Real owner/cache and broker vectors in the exact image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --memory 1g --pids-limit 128 --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,size=512m --mount type=bind,source="$PWD",target=/source,readonly --env CALIBRE_CONFIG_DIRECTORY=/tmp/config --env CALIBRE_TEMP_DIR=/tmp --env HOME=/tmp --entrypoint /opt/calibre/calibre-debug librarium-writer-acceptance -e /source/scripts/calibre_delivery_gate.py
      - name: Native process death and receipt recovery in the exact image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --memory 1g --pids-limit 128 --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,size=512m --mount type=bind,source="$PWD",target=/source,readonly --env LIBRARIUM_CALIBRE_RUNTIME=/opt/calibre --entrypoint /usr/local/bin/python librarium-writer-acceptance /source/.github/scripts/delivery_native_kills.py
  native-role-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBRARIUM_SECRET_KEY: disposable-ci-only-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      LIBRARIUM_WRITER_PORT: '8133'
      LIBRARIUM_CALIBRE_PORT: '8134'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Frozen dependencies and native prerequisites
        run: |
          uv sync --frozen
          sudo apt-get update
          sudo apt-get install --yes postgresql libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 libnss3 libdbus-1-3 libxcomposite1 libxdamage1 libxrandr2 libxrender1 libxi6 libxtst6 libfontconfig1 libfreetype6 libglib2.0-0
          uv run python scripts/build_libarchive.py --prefix "$RUNNER_TEMP/libarchive" --build-dir "$RUNNER_TEMP/native-build"
          uv run python scripts/install_epubcheck.py --prefix "$RUNNER_TEMP/epubcheck"
          echo "LIBARCHIVE=$RUNNER_TEMP/libarchive/lib/libarchive.so.13.8.10" >> "$GITHUB_ENV"
          echo "LIBRARIUM_EPUBCHECK_DIR=$RUNNER_TEMP/epubcheck" >> "$GITHUB_ENV"
          echo "LIBRARIUM_JAVA=$JAVA_HOME_21_X64/bin/java" >> "$GITHUB_ENV"
      - name: Download and verify official Calibre checksum before extraction
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile, urllib.request
          pin = json.loads(pathlib.Path('scripts/calibre_delivery_runtime.json').read_text())
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'calibre-delivery'
          root.mkdir()
          archive = root / 'calibre-9.17.0-x86_64.txz'
          with urllib.request.urlopen(pin['hash_source'], timeout=60) as response:
              official = response.read(4096).decode().split()[0].lower()
          if official != pin['sha512']:
              raise SystemExit('Official checksum differs from reviewed pin')
          with urllib.request.urlopen(pin['archive_source'], timeout=60) as source, archive.open('wb') as target:
              while block := source.read(1024 * 1024):
                  target.write(block)
          with archive.open('rb') as source:
              sha512 = hashlib.file_digest(source, 'sha512').hexdigest()
          with archive.open('rb') as source:
              sha256 = hashlib.file_digest(source, 'sha256').hexdigest()
          if sha512 != official or sha256 != pin['sha256'] or archive.stat().st_size != pin['bytes']:
              raise SystemExit('Calibre archive verification failed')
          runtime = root / 'runtime'
          runtime.mkdir()
          with tarfile.open(archive, 'r:xz') as distribution:
              distribution.extractall(runtime, filter='data')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'LIBRARIUM_CALIBRE_RUNTIME={runtime}\n')
          PY
      - name: Isolated socket-only PostgreSQL and namespace prerequisites
        run: |
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/delivery-socket"
          /usr/lib/postgresql/16/bin/initdb -D "$RUNNER_TEMP/delivery-postgres" --auth=trust --username="$(id -un)"
          /usr/lib/postgresql/16/bin/pg_ctl -D "$RUNNER_TEMP/delivery-postgres" -l "$RUNNER_TEMP/delivery-postgres.log" -o "-k $RUNNER_TEMP/delivery-socket -p 55432 -c listen_addresses=''" start
          PGHOST="$RUNNER_TEMP/delivery-socket" PGPORT=55432 /usr/lib/postgresql/16/bin/createdb librarium_delivery_fix_ci
          echo "PGHOST=$RUNNER_TEMP/delivery-socket" >> "$GITHUB_ENV"
          echo "PGPORT=55432" >> "$GITHUB_ENV"
          echo "PGDATABASE=librarium_delivery_fix_ci" >> "$GITHUB_ENV"
          echo "PGUSER=$(id -un)" >> "$GITHUB_ENV"
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --net true
      - name: Required native gate, kill vectors and content-server proof
        run: sh .github/scripts/delivery_native_acceptance.sh
      - name: Stop fixture PostgreSQL
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/delivery-postgres/postmaster.pid"; then
            /usr/lib/postgresql/16/bin/pg_ctl -D "$RUNNER_TEMP/delivery-postgres" -m fast stop
          fi
