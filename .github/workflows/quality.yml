name: Source quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      source-sha:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source-sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source-quality:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_USER: librarium
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: librarium
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U librarium -d librarium"
          --health-interval 5s --health-timeout 3s --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: librarium
      PGPASSWORD: disposable-ci-only
      PGDATABASE: librarium
      LIBRARIUM_SECRET_KEY: disposable-ci-only-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      LIBRARIUM_REQUIRE_LANDLOCK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check public content without exposing matched values
        run: |
          python3 -m unittest tests.test_public_content -q
          python3 scripts/check_public_content.py
      - name: Changed areas
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: python3 .github/scripts/changed_areas.py "$BASE" | tee -a "$GITHUB_OUTPUT"
      - name: Record exact source and workflow provenance
        run: |
          mkdir -p "$RUNNER_TEMP/source-quality-reports"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          report = {'source_sha': source}
          for name in ['GITHUB_SHA', 'GITHUB_REF', 'GITHUB_EVENT_NAME', 'GITHUB_WORKFLOW_REF', 'GITHUB_WORKFLOW_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT']:
              report[name.lower()] = os.environ.get(name)
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-quality-reports' / 'revision.json'
          target.write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Tested source: `{source}`. Reports retain workflow/event/ref provenance.\n')
          PY
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        id: setup-uv
        with:
          version: '0.13.6'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        id: setup-node
        if: ${{ !cancelled() && steps.changes.outputs.frontend == 'true' }}
        with:
          node-version: '24.22.1'
      - name: Frozen Python dependencies
        id: python-dependencies
        if: ${{ !cancelled() && steps.setup-uv.outcome == 'success' }}
        run: |
          uv sync --frozen
      - name: Frozen frontend dependencies
        id: frontend-dependencies
        if: ${{ !cancelled() && steps.setup-node.outcome == 'success' }}
        run: |
          npm --prefix frontend ci
      - name: Documentation tests
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' && steps.changes.outputs.python != 'true' && steps.changes.outputs.docs == 'true' }}
        run: uv run pytest -W error -q tests/test_design_system.py tests/test_changed_areas.py
      - name: Isolated native inputs
        id: native-inputs
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' && steps.changes.outputs.python == 'true' }}
        run: |
          uv run python scripts/build_libarchive.py --prefix "$RUNNER_TEMP/libarchive" --build-dir "$RUNNER_TEMP/native-build"
          uv run python scripts/install_epubcheck.py --prefix "$RUNNER_TEMP/epubcheck"
          echo "LIBARCHIVE=$RUNNER_TEMP/libarchive/lib/libarchive.so.13.8.10" >> "$GITHUB_ENV"
          echo "LIBRARIUM_EPUBCHECK_DIR=$RUNNER_TEMP/epubcheck" >> "$GITHUB_ENV"
          echo "LIBRARIUM_JAVA=$JAVA_HOME_21_X64/bin/java" >> "$GITHUB_ENV"
      - name: Warning-strict Python tests
        if: ${{ !cancelled() && steps.native-inputs.outcome == 'success' }}
        run: |
          uv run pytest -W error --cov=librarium --cov=scripts.capture_source --cov-report=term --cov-report=xml:"$RUNNER_TEMP/source-quality-reports/python-coverage.xml" --junitxml="$RUNNER_TEMP/source-quality-reports/python-tests.xml" -q
      - name: Python types
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' && steps.changes.outputs.python == 'true' }}
        run: |
          uv run mypy
          uv run mypy scripts/populated_upgrade.py scripts/upgrade_fixture.py
      - name: Python lint
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' && steps.changes.outputs.python == 'true' }}
        run: |
          uv run ruff check backend scripts/capture_source.py tests/test_capture_source.py
          uv run ruff check --isolated scripts/release.py scripts/registry.py scripts/registry_config.py scripts/promotion.py tests/test_release.py tests/test_registry.py tests/test_registry_config.py tests/test_promotion.py
          uv run ruff check --isolated scripts/populated_upgrade.py scripts/upgrade_fixture.py tests/test_populated_upgrade.py tests/test_upgrade_fixture.py
          uv run ruff check --isolated scripts/check_public_content.py tests/test_public_content.py
      - name: Migration, lock, export and workspace integrity
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' && steps.changes.outputs.python == 'true' }}
        run: |
          uv run python backend/manage.py check
          uv run python backend/manage.py makemigrations --check --dry-run
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          diff <(tail -n +3 requirements.txt) <(tail -n +3 "$RUNNER_TEMP/requirements.txt")
          python3 scripts/dev.py check
      - name: Frontend tests
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        working-directory: frontend
        run: npm run coverage
      - name: Frontend types and build
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        working-directory: frontend
        run: npm run build
      - name: Frontend format
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        working-directory: frontend
        run: npx --no-install prettier --check src tests vite.config.ts reader-page.ts index.html reader.html tsconfig.json
      - name: Python dependency security audit
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' && steps.changes.outputs.python == 'true' }}
        run: uv run pip-audit --format=json --output="$RUNNER_TEMP/source-quality-reports/python-audit.json"
      - name: Frontend dependency security audit
        if: ${{ !cancelled() && steps.frontend-dependencies.outcome == 'success' }}
        run: npm --prefix frontend audit --json > "$RUNNER_TEMP/source-quality-reports/frontend-audit.json"
      - name: Scan source history for secrets with redacted evidence
        if: ${{ !cancelled() }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=HEAD --redact=100 --no-banner --no-color --ignore-gitleaks-allow --config=.github/gitleaks.toml --gitleaks-ignore-path=/dev/null --timeout=180 --report-format=json --report-path="$RUNNER_TEMP/source-quality-reports/secrets.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-quality-reports
          path: |
            ${{ runner.temp }}/source-quality-reports/
            frontend/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 30
