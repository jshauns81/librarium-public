name: ${LIBRARIUM_PROJECT_NAME:?Set an isolated Compose project name}

x-app: &app
  image: ${LIBRARIUM_IMAGE:?Set the approved ghcr.io image digest}
  pull_policy: always
  platform: linux/amd64
  environment:
    LIBRARIUM_CATALOGUE_STATUS_URL: ${LIBRARIUM_CATALOGUE_STATUS_URL:-}
    LIBRARIUM_CATALOGUE_STATUS_PAGE_URL: ${LIBRARIUM_CATALOGUE_STATUS_PAGE_URL:-}
    PGHOST: db
    PGPORT: "5432"
    PGDATABASE: librarium
    PGUSER: librarium
    PGPASSWORD: ${LIBRARIUM_DB_PASSWORD:?Set a database password in Dockhand}
    LIBRARIUM_SECRET_KEY: ${LIBRARIUM_SECRET_KEY:?Set a random application secret in Dockhand}
    LIBRARIUM_PUBLIC_ORIGIN: ${LIBRARIUM_PUBLIC_ORIGIN:?Set the authenticated HTTPS origin}
    LIBRARIUM_TRUST_PROXY: "1"
    LIBRARIUM_LIBRARY_URL: ${LIBRARIUM_LIBRARY_URL:-}
    LIBRARIUM_CATALOGUE_DIR: ${LIBRARIUM_CATALOGUE_DIR:-}
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  init: true
  stop_grace_period: 30s
  mem_limit: 3g
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    restart: unless-stopped
    environment:
      POSTGRES_DB: librarium
      POSTGRES_USER: librarium
      POSTGRES_PASSWORD: ${LIBRARIUM_DB_PASSWORD:?Set a database password in Dockhand}
    volumes:
      - type: bind
        source: ${LIBRARIUM_DATA_ROOT:?Set an absolute persistent appdata directory}/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librarium -d librarium"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  initialize:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db: {condition: service_healthy}

  web:
    <<: *app
    restart: unless-stopped
    expose: ["8123"]
    networks:
      default: {}
      edge:
        aliases: ["${LIBRARIUM_PROJECT_NAME:?Set an isolated Compose project name}-web"]
    volumes:
      - type: bind
        source: ${LIBRARIUM_DATA_ROOT:?Set an absolute persistent appdata directory}/catalogue
        target: /catalogue
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/api/health', timeout=3).read()"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s
    depends_on:
      initialize: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: ["python", "manage.py", "inspection_worker"]
    restart: unless-stopped
    depends_on:
      initialize: {condition: service_completed_successfully}

networks:
  default:
    internal: true
  edge:
    name: ${LIBRARIUM_EDGE_NETWORK:?Set a dedicated edge network}
