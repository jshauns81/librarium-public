name: librarium-experiment
x-app: &app
  image: librarium:local-experiment
  build: .
  environment: &environment
    LIBRARIUM_CATALOGUE_STATUS_URL: ${LIBRARIUM_CATALOGUE_STATUS_URL:-}
    LIBRARIUM_CATALOGUE_STATUS_PAGE_URL: ${LIBRARIUM_CATALOGUE_STATUS_PAGE_URL:-}
    PGHOST: db
    PGPORT: "5432"
    PGDATABASE: librarium
    PGUSER: librarium
    PGPASSWORD: ${LIBRARIUM_DB_PASSWORD:?Set a local experiment database password}
    LIBRARIUM_SECRET_KEY: ${LIBRARIUM_SECRET_KEY:?Set a local experiment secret key}
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
services:
  db:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_DB: librarium
      POSTGRES_USER: librarium
      POSTGRES_PASSWORD: ${LIBRARIUM_DB_PASSWORD:?Set a local experiment database password}
    volumes: ["experiment-db:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librarium -d librarium"]
      interval: 3s
      timeout: 3s
      retries: 20
  initialize:
    <<: *app
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py seed_demo"]
    depends_on:
      db: {condition: service_healthy}
  web:
    <<: *app
    restart: unless-stopped
    ports: ["127.0.0.1:8123:8123"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/api/works?q=__healthcheck__', timeout=3).read()"]
      interval: 15s
      timeout: 4s
      retries: 3
    depends_on:
      initialize: {condition: service_completed_successfully}
  worker:
    <<: *app
    command: ["python", "manage.py", "inspection_worker"]
    restart: unless-stopped
    depends_on:
      initialize: {condition: service_completed_successfully}
volumes:
  experiment-db:
