[project]
name = "librarium-lab"
version = "0.1.0"
description = "An isolated migration laboratory for Library Finish and BL Catalog"
requires-python = ">=3.12"
dependencies = ["Django>=5.2,<5.3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.9,<5", "pytest-cov>=6,<8", "ruff>=0.11", "pip-audit>=2.9"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["librarium_lab"]

[tool.coverage.report]
fail_under = 80
show_missing = true
