<!-- @dsCard height=288 -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Librarium</title>
<style>
  html,body{margin:0;background:var(--ground)}
  .cover{position:relative;width:960px;height:288px;overflow:hidden;background:var(--ground)}
  .cover svg{position:absolute;inset:0}
  .copper{fill:var(--copper)} .brass{fill:var(--brand-accent)} .teal{fill:var(--accent)} .parch{fill:var(--ink)} .mist{fill:var(--muted)}
  .spine{rx:var(--radius-art)}
  .seal{fill:none;stroke:var(--brand-accent);stroke-width:2}
  .shelf{stroke:var(--line);stroke-width:1}
  .words{position:absolute;left:48px;bottom:44px;max-width:440px}
  .name{margin:0;font-family:var(--font-serif);font-weight:550;font-size:84px;line-height:.95;letter-spacing:-0.025em;color:var(--ink)}
  .tag{margin:16px 0 0;font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--muted)}
</style></head>
<body><div class="cover">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <!--
    blocks: copper 64x200, parch (ink) 32x168, brass (brand-accent) 48x192, teal (accent) 40x144, mist (muted) 24x120; widths are space-gutter-max/space-panel/space-panel-wide/space-section multiples
    arrangement: unequal spines standing flush on one hairline shelf, left of a half-risen seal; nothing left of x=480
    pattern: literal motif, the emblem's double circular seal as two arcs; "the Reading Lamp, opened into a reading room" with the supplied seal as identity anchor
    steps and radii: 8px (space-tight/2) gaps between spines, radius-art on every spine, shelf rule in line at 1px, seal stroke 2px in brand-accent
  -->
  <path class="seal" d="M712 232 A168 168 0 0 1 1048 232"/>
  <path class="seal" d="M736 232 A144 144 0 0 1 1024 232"/>
  <rect class="spine copper" x="560" y="32" width="64" height="200"/>
  <rect class="spine parch" x="632" y="64" width="32" height="168"/>
  <rect class="spine brass" x="672" y="40" width="48" height="192"/>
  <rect class="spine teal" x="728" y="88" width="40" height="144"/>
  <rect class="spine mist" x="776" y="112" width="24" height="120"/>
  <line class="shelf" x1="520" y1="232.5" x2="960" y2="232.5"/>
</svg>
<div class="words"><p class="name">Librarium</p><p class="tag">A personal Warhammer and Black Library reading room, with the engineering on demand.</p></div>
</div></body></html>
