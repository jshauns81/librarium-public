<!doctype html>
<html><head><meta charset="utf-8"><title>Masthead</title></head>
<body>
<header class="masthead">
  <div class="brand">
    <svg class="archivist-mark" viewBox="0 0 1000 1000" width="256" height="256" aria-hidden="true"><use href="../../brand/librarium-symbols.svg#small" width="1000" height="1000"/></svg>
    <svg class="wordmark" viewBox="0 0 1060 320" width="1060" height="320" role="img" aria-label="Librarium"><use href="../../brand/librarium-symbols.svg#wordmark" width="1060" height="320"/></svg>
  </div>
  <nav class="navigation" aria-label="Workspace">
    <button aria-current="page">Library</button><button>Catalogue</button><button>Reviews<span class="count">2 active</span></button>
  </nav>
  <div id="library-search-slot"><form class="library-search" role="search" aria-label="Library search"><input type="search" placeholder="Search titles, authors or series"><button type="submit" aria-label="Search library"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor"/><path d="m10 10 4 4" stroke="currentColor"/></svg></button></form></div>
  <div class="theme-picker"><label for="t">Theme</label><select id="t"><option>Librarium</option><option>Parchment</option></select></div>
</header>
</body></html>
